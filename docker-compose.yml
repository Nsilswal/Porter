# Local development only. Database is reachable only on the loopback interface.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: porter
      POSTGRES_PASSWORD: porter
      POSTGRES_DB: porter
    ports: ["127.0.0.1:55432:5432"]
    # New volume for PostgreSQL 17; do not mount an old PostgreSQL 16 data dir.
    volumes: ["porter-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porter -d porter"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  porter-postgres:
